server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 直连 frontend Service 时也能访问 /api（经 Ingress 时由 Ingress 分流）
    # 关键：用变量 + resolver，把上游解析推迟到请求时，
    # 避免 backend Service 尚未创建时 nginx 启动即失败（host not found in upstream）
    location /api/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s;
        set $backend_upstream http://backend.app.svc.cluster.local:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
